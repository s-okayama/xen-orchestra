services:
  xen-orchestra-build-test:
    image: node:20-alpine
    working_dir: /app
    # Use multiple CPUs for faster processing
    deploy:
      resources:
        limits:
          cpus: '0'  # Use all available CPUs (0 means no limit)
    volumes:
      # Mount the entire project directory
      - .:/app
      # Mount the @xen-orchestra directory specifically to avoid copying
      - ./@xen-orchestra:/app/@xen-orchestra
      # Exclude node_modules from being mounted
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - TURBO_TELEMETRY_DISABLED=1
      # Enable parallel builds in Turbo
      - TURBO_TEAM=local
      - TURBO_REMOTE_ONLY=false
    command: >
      sh -c "
        apk add --no-cache python3 make g++ git &&
        yarn install --ignore-optional --ignore-scripts &&
        yarn build
      "
